    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F2D06B;
            --gold-dark: #A68612;
            --dark: #1A1A1A;
            --light-bg: #FCF9F6;
            --card-bg: #FFFFFF;
            --border: rgba(212, 175, 55, 0.25);
            --radius: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            --shadow-gold: 0 4px 20px rgba(212, 175, 55, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lato', sans-serif;
        }

        body {
            background: var(--light-bg);
            color: var(--dark);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Top Header */
        header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 25px 0 20px;
            text-align: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.03);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-wrap {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--dark);
        }

        .logo-wrap img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--gold);
        }

        .brand-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--dark);
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .brand-text span {
            font-size: 0.78rem;
            color: var(--gold-dark);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* Navigation Tabs */
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #fff;
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--dark);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .tab-btn.active {
            background: var(--gold);
            color: #fff;
            border-color: var(--gold);
            box-shadow: var(--shadow-gold);
        }

        /* Content Sections */
        .tab-content {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Selector Bar */
        .controls-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 25px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }

        .controls-card label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--dark);
        }

        .select-input {
            padding: 10px 15px;
            border: 1px solid var(--gold);
            border-radius: 8px;
            background: #fff;
            font-size: 0.95rem;
            color: var(--dark);
            outline: none;
            cursor: pointer;
            flex-grow: 1;
            max-width: 380px;
        }

        .btn-action {
            background: var(--dark);
            color: #fff;
            border: none;
            padding: 11px 22px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
        }

        .btn-gold {
            background: var(--gold);
            color: #fff;
        }

        .btn-gold:hover {
            background: var(--gold-dark);
        }

        /* Result Display Card */
        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            position: relative;
        }

        .result-card h2 {
            font-family: 'Playfair Display', serif;
            color: var(--dark);
            font-size: 1.4rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--gold-light);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-meta {
            font-family: 'Lato', sans-serif;
            font-size: 0.78rem;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-dark);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        /* Script Breakdown */
        .scene-block {
            background: #FAFAFA;
            border-left: 4px solid var(--gold);
            padding: 16px 20px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 18px;
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--gold-dark);

        .scene-body {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .scene-visual {
            color: #555;
            margin-bottom: 8px;
            font-style: italic;
        }

        .scene-audio {
            font-weight: 600;
            color: var(--dark);
            background: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px dashed rgba(0,0,0,0.1);
        }

        .scene-overlay {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #777;
        }

        .scene-overlay span {
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            color: #333;
        }

        /* Copy Block */
        .copy-box {
            background: #F8F9FA;
            border: 1px solid #E9ECEF;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #333;
            margin-top: 15px;
            position: relative;
        }

        .btn-copy {
            background: #fff;
            border: 1px solid var(--gold);
            color: var(--gold-dark);
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-copy:hover {
            background: var(--gold);
            color: #fff;
        }

        .btn-copy.copied {
            background: #28a745 !important;
            color: #fff !important;
            border-color: #28a745 !important;
        }

        /* Carousel Slides Grid */
        .slides-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .slide-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .slide-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--gold-dark);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .slide-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .slide-desc {
            font-size: 0.88rem;
            color: #555;
            line-height: 1.4;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        .slide-visual-hint {
            font-size: 0.78rem;
            color: #888;
            border-top: 1px dashed #eee;
            padding-top: 8px;
            font-style: italic;
        }

        /* Toast Alert */
        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--dark);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--gold);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .controls-card {
                flex-direction: column;
                align-items: stretch;
            }
            .select-input {
                max-width: 100%;
            }
            .slides-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        // Tab switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            const targetTab = document.getElementById(`tab-${tabId}`);
            if (targetTab) {
                targetTab.classList.add('active');
            }

            event.currentTarget.classList.add('active');

            if (tabId === 'reels') renderReel();
            if (tabId === 'carruseles') renderCarousel();
            if (tabId === 'whatsapp') renderWhatsApp();
            if (tabId === 'tips') renderTips();
        }

        // Toast Helper
        function showToast(msg = "âœ… Copiado al portapapeles") {
            const toast = document.getElementById('toast');
            toast.querySelector('span').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Clipboard Copy Helper
        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
                if (btnElement) {
                    const originalText = btnElement.innerHTML;
                    btnElement.innerHTML = "âœ… Â¡Copiado!";
                    btnElement.classList.add('copied');
                    setTimeout(() => {
                        btnElement.innerHTML = originalText;
                        btnElement.classList.remove('copied');
                    }, 2000);
                }
            }).catch(err => {
                alert("Error al copiar: " + err);
            });
        }
