        <p>Estamos transfiriendote de forma segura con una de nuestras asesoras expertas para atender tu solicitud.</p>
        <a id="btnFallback" href="#" class="btn-wa">Abrir WhatsApp Directamente</a>

                <span>Vigilado por la Superintendencia de Industria y Comercio (SIC)</span>
            </a>
        </div>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const cliente = urlParams.get('cliente') || urlParams.get('c') || '';
            const origen = urlParams.get('origen') || urlParams.get('utm_source') || 'web';
            const sede = urlParams.get('sede') || '';

            let mensaje = "Hola, ";
            if (cliente) {
                mensaje += "soy " + decodeURIComponent(cliente) + ", ";
            }
            if (origen === 'email' || origen === 'email_siigo') {
                mensaje += "recibi el correo de promociones de Julie Alisados y deseo agendar mi cita";
            } else if (sede) {
                mensaje += "deseo consultar sobre citas y valoraciones para la sede " + decodeURIComponent(sede);
            } else {
                mensaje += "deseo informacion sobre los alisados y tratamientos de Julie Alisados";
            }

            const waPhone = "573043588180";
            const targetUrl = "https://wa.me/" + waPhone + "?text=" + encodeURIComponent(mensaje);

            document.getElementById('btnFallback').href = targetUrl;

            setTimeout(function() {
                window.location.replace(targetUrl);
            }, 300);
        })();
    </script>
